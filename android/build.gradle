buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"





allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') {
                details.useVersion "8.2.1"
            }
        }
    }
}

// Workaround for react-native-voice Gradle implicit dependency issue on Gradle 9+
def configureVoiceResourceTask = { p ->
    p.afterEvaluate { projectWithTasks ->
        projectWithTasks.tasks.matching { it.name == 'packageDebugResources' }.configureEach {
            dependsOn(projectWithTasks.tasks.matching { it.name == 'generateDebugResValues' })
        }
    }
}

configureVoiceResourceTask(project(':react-native-voice_voice'))

